<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        label {
            display: inline -block;
            width: 130px;
        }
        </style>
</head>
<body>
    <form action="">
        <table celpadding="8">
        <!--First Name-->
        <tr>
        <td>
        <label for="first name">First Name</label></td>
        <td>
        <Input type="text" id="first name"></td>
        </tr>
        <!--Last name-->
        <tr>
        <td>
        <label for="last name">Last Name</label></td>
        <td>
        <Input type="text" id="last name">
        </td>
        </tr>
        <!--Phone Number-->
        <tr>
        <td>
        <label for="phone number">Phone Number</label></td>
        <td>
        <Input type="text" id="phone number">
        </td>
        </tr>
        <!--Age-->
        <tr>
        <td>
        <label for="age">Age</label></td>
        <td>
        <Input type="text" id="age">
        </td>
        </tr>
        <!--email-->
        <tr>
        <td>
        <label for="email">Email</label></td>
        <td>
        <Input type="email" id="email">
        </td>
        </tr>
        <!--Gender-->
        <tr>
        <td>
        <label for="gender">Gender:</label></td>
        <td>
        <input type="radio" name="gender" value="male"> 
        <label for="male">Male</label>
        <input type="radio" name="gender" value="female"> 
        <label for="female">Female</label>
        </td>
        </tr>
        <!--Address-->
        <tr>
        <td>
        <label for="address">Address</label></td>
        <td>
        <Input type="text" id="address">
        </td>
        </tr>
        <!--Marksheets-->
        <tr>
        <td>
        <label for="marksheets">Marksheets</label></td>
        <td>
        <Input type="file" id="marksheets">
        </td>
        </tr>
        <!--Password-->
        <tr>
        <td>
        <label for="password">Password</label></td>
        <td>
        <Input type="password" id="password">
        </td>
        </tr>
        <!--Submit Button-->
        <tr>
        <td colspan="2" style="text-align: center;">
        <input type="submit" value="Submit">
        </td>
        </tr>
        </table>
    </form>
</body>
</html>
